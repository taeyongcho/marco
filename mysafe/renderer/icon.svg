<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#shine)"/>

  <!-- 금고 문 -->
  <rect x="52" y="52" width="152" height="152" rx="26" fill="url(#door)" filter="url(#sh)"/>
  <rect x="64" y="64" width="128" height="128" rx="18" fill="none" stroke="#94a3b8" stroke-width="3" stroke-opacity="0.6"/>

  <!-- 경첩 -->
  <rect x="40" y="86" width="14" height="30" rx="5" fill="url(#metal)"/>
  <rect x="40" y="140" width="14" height="30" rx="5" fill="url(#metal)"/>

  <!-- 다이얼 -->
  <circle cx="116" cy="128" r="36" fill="url(#metal)"/>
  <circle cx="116" cy="128" r="26" fill="#e2e8f0"/>
  <circle cx="116" cy="128" r="20" fill="none" stroke="#475569" stroke-width="3"/>
  <g stroke="#1e293b" stroke-width="4" stroke-linecap="round">
    <line x1="116" y1="104" x2="116" y2="112"/>
    <line x1="116" y1="144" x2="116" y2="152"/>
    <line x1="92" y1="128" x2="100" y2="128"/>
    <line x1="132" y1="128" x2="140" y2="128"/>
  </g>
  <line x1="116" y1="128" x2="128" y2="114" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <circle cx="116" cy="128" r="5" fill="#1e293b"/>

  <!-- 손잡이 -->
  <rect x="166" y="98" width="14" height="60" rx="7" fill="url(#metal)"/>
  <rect x="160" y="122" width="26" height="12" rx="6" fill="url(#metal)"/>
</svg>
